<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function addTodo(){
            const title =  document.getElementById("title").value
            const description = document.getElementById("description").value
        //    const innerHtml = document.getElementById("container").innerHTML

           const outerDiv = document.createElement("div")
            outerDiv.innerHTML = title

           const outerDiv2 = document.createElement("div")
            outerDiv2.innerHTML = description
            document.getElementById("container").appendChild(outerDiv)
            document.getElementById("container").appendChild(outerDiv2)

    //        document.getElementById("container").innerHTML = innerHtml + `<div>
    //     <div>${title}</div>
    //     <div>${description}</div>
    //     <button>Mark as done</button>
    // </div>`
          
        }
    </script>
</head>
<body>
   
    <input id="title" type="text" placeholder="title"> <br>
    <br>
    <input id="description" type="text" placeholder="description"> <br>
    <br>
    <button id="button" onclick="addTodo()">Add todo</button> <br>
    <br>
    <div id="container"></div>

    
</body>
</html>
